# Artifact path conventions (resolved by harness.Phase.check_preconditions):
#   - bare names (spec.md) → relative to artifacts/features/<slug>/
#   - features/<slug>/...  → relative to artifacts/ (<slug> / {feature} substituted)
# circuit_breaker.block_phase defaults to last phase (Verify). Optional:
#   circuit_breaker:
#     block_phase: Verify
#     reset_phase: Plan
#     max_failures: 2
phases:
  - name: Spec
    preconditions:
      - artifact: spec.md
        check: exists
      - artifact: features/<slug>/status.md
        check: exists
  - name: Plan
    preconditions:
      - artifact: spec.md
        check: exists
      - artifact: plan.md
        check: exists
      - artifact: tasks.md
        check: exists
  - name: Implement
    preconditions:
      - artifact: plan.md
        check: exists
      - artifact: tasks.md
        check: exists
  - name: Verify
    preconditions:
      - artifact: spec.md
        check: exists
      - artifact: tasks.md
        check: exists
      - artifact: features/<slug>/alignment-audit.md
        check: exists

# Per-gate on_fail wins; else gate_defaults.on_fail; else block.
gate_defaults:
  on_fail: block

gates:
  - name: lint
    command: npm run lint
    stack: node
    on_fail: block
  - name: typecheck
    command: npm run typecheck
    stack: node
    on_fail: block
  - name: test-node
    command: npm test
    stack: node
    on_fail: block

stack_detection:
  node:
    files:
      - package.json
    gates:
      - lint
      - typecheck
      - test-node

preflight_tools:
  npm:
    command: npm

thresholds:
  token_warn: 160000
  token_hard: 200000
  timeout_seconds: 300
  memory_warn_lines: 100
  memory_breach_lines: 200
  memory_hard_lines: 3200

# Context engine (optional overrides; defaults match DEFAULT_* in context_engine.py)
context:
  tier_boost:
    Must: 40
    Should: 20
    Skip: 0
  summary_budget: 800
  partial_budget: 1200
